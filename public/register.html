<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Smart Student Lost & Found</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon">🎓</div>
        <span>Campus Lost & Found</span>
      </a>
      <div id="nav-auth-section" class="nav-auth">
        <a href="/login.html" class="btn btn-secondary btn-sm">Log In</a>
      </div>
    </div>
  </nav>

  <!-- Register Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">📝</div>
        <h1 class="auth-title">Student Registration</h1>
        <p class="auth-subtitle">Create your campus student account to report and claim items</p>
      </div>

      <div id="register-error" class="alert alert-danger" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
          <input type="text" id="reg-name" name="name" class="form-control" placeholder="e.g., Aarav Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Campus Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" name="email" class="form-control" placeholder="e.g., yourname@campus.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password <span class="required">*</span></label>
          <input type="password" id="reg-confirm" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Create Student Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="/login.html" style="font-weight: 600;">Sign In</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div>© 2026 Smart Student Lost & Found Management System • DBMS Capstone</div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
